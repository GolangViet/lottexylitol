<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="SwaggerUI" />
  <title>SwaggerUI</title>
  <!-- <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@4.5.0/swagger-ui.css" /> -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.20.0/swagger-ui.min.css" integrity="sha512-PHWCrfComaI7q6IfIDnBcqNXpAwfq5jg5gmgLB8Qs4FMFGGITwC/ULoPKCAdVIUx6GA4C4cs8jIlsMRtfiZsfA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
<!-- https://github.com/swagger-api/swagger-ui/blob/master/docs/usage/installation.md -->
<div id="swagger-ui"></div>
<!-- <script src="https://unpkg.com/swagger-ui-dist@4.5.0/swagger-ui-bundle.js" crossorigin></script> -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.20.0/swagger-ui-bundle.js" integrity="sha512-8LQvWJkLbfQYD4U7L1jWv4t+GZePWlCJwVC5fXFlDTDYpOjPrYARfTlEn3Tpnq/9WtzUkBY4HjXJgDz/z8FKAg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
  window.onload = () => {
    window.ui = SwaggerUIBundle({
      url: 'website.yaml',
      dom_id: '#swagger-ui',
    });
  };
</script>
</body>
</html>
