<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="light dark">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vietguys SMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <h1 class="mt-3">Vietguys SMS</h1>
        <div class="mt-3">
            <form>
                <div class="mb-3">
                    <label for="phone" class="form-label">Số điện thoại</label>
                    <input type="tel" class="form-control input-phone" id="phone" placeholder="84xxxxxxx">
                </div>
                <button type="submit" class="btn btn-primary js-submit">Gửi</button>
            </form>
        </div>
        <div class="mt-3">
            <h3>Kết quả</h3>
            <pre class="result border p-2">
                <br>
            </pre> 
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        jQuery(function($) {
            $(document).on('click', '.js-submit', function(e) {
                e.preventDefault();

                let phone = $('.input-phone').val();
                
                if(phone.length < 10) {
                    return alert('Vui lòng nhập đúng số điện thoại!');
                }

                if(confirm(`Bạn có chắc muốn gửi test sms cho sdt ${phone} không?`)) {
                    var result = $('.result');

                    if(result.hasClass('loading')) return;

                    result.addClass('loading').html('Waiting ...');

                    var timeoutID = setTimeout(function(){
                        result.removeClass('loading').html('');
                    }, 30000)

                    $.post('vietguys.php', {
                        phone: phone
                    },function(data){
                        result.removeClass('loading');

                        if(timeoutID > 0) {
                            clearTimeout(timeoutID);
                        }

                        result.html(data);
                    })
                }
            });
        });
    </script>
</body>

</html>
