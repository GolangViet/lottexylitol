<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="light dark">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lắc hủ Lotte</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <style>
        tbody input {
            width: 100%;
        }
        th {
            text-align: center;
        }
        thead {
            position: sticky;
            top: 0;
            background: white;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="mt-3">Lắc hủ Lotte</h1>
        <div class="mt-3">
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th colspan="2" class="gift-name"><span class="btn btn-outline-danger">Golden ticket</span>​</th>
                        <th colspan="2" class="gift-name"><span class="btn btn-outline-warning">E-voucher</span></th>
                        <th colspan="2" class="gift-name"><span class="btn btn-outline-info">20.000 VND​</span></th>
                        <th colspan="2" class="gift-name"><span class="btn btn-outline-success">10.000 VND​</span></th>
                        <th colspan="2" class="gift-name"><span class="btn btn-outline-secondary">Chúc may mắn</span></th>
                        <th>
                            <button type="button" class="btn btn-primary js-play">Lắc hủ tự động</button>
                            <button type="button" class="btn btn-danger js-stop">STOP</button>
                        </th>
                    </tr>
                    <tr>
                        <th width="100">Tổng</th>
                        <th width="100">Tỉ lệ</th>
                        <th width="100">Tổng</th>
                        <th width="100">Tỉ lệ</th>
                        <th width="100">Tổng</th>
                        <th width="100">Tỉ lệ</th>
                        <th width="100">Tổng</th>
                        <th width="100">Tỉ lệ</th>
                        <th width="100">Tổng</th>
                        <th width="100">Tỉ lệ</th>
                        <th>Trúng giải</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><input class="gift-total" value="10"></td>
                        <td></td>
                        <td><input class="gift-total" value="9"></td>
                        <td></td>
                        <td><input class="gift-total" value="35"></td>
                        <td></td>
                        <td><input class="gift-total" value="660"></td>
                        <td></td>
                        <td><input class="gift-total" value="235939"></td>
                        <td></td>
                        <td class="prize">-</td>
                    </tr>
                </tbody>
                <!-- <tfoot>
                    <tr>
                        <td colspan="9" class="text-center">
                            
                        </td>
                    </tr>
                </tfoot> -->
            </table>
        </div>
        <br>
        <br>
        <br>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        jQuery(function($) {
            
            var list = [], row = 0, intervalId = 0;

            $(document).on('click', '.js-play', function(e) {
                e.preventDefault();

                intervalId = setInterval(lachu, 100);
            });

            $(document).on('click', '.js-stop', function(e) {
                e.preventDefault();

                clearInterval(intervalId);
            });

            function lachu()
            {
                let tr = $('tbody tr:last-child');

                list = [];

                tr.find('.gift-total').each(function(index){
                    var total = $(this).val();

                    for(let i = 0; i < total; i++) {
                        list.push(index);
                    }
                })

                if(list.length == 0) {
                    clearInterval(intervalId);

                    return alert('Hết quà');
                }

                row++;

                let gift_index = list[randomNumber(0, list.length - 1)];

                let new_tr = $(tr.prop('outerHTML')).attr('data-row', row);

                $('tbody').append(new_tr);

                let $gift_total = new_tr.find('.gift-total').removeClass('bg-warning').eq(gift_index);
                
                // console.log('$gift_total', row, $('.gift-name').eq(gift_index).text(), $gift_total.val());

                $gift_total.attr('value', parseInt($gift_total.val()) - 1).addClass('bg-warning');

                // console.log('new_tr', row, new_tr.prop('outerHTML'));

                new_tr.find('.prize').html($('.gift-name').eq(gift_index).html());

                setRatesByTotals(new_tr);
            }

            function randomNumber(min, max)
            {
                min = Math.ceil(min);
                max = Math.floor(max);
                return Math.floor(Math.random() * (max - min + 1)) + min;
            }

            function setRatesByTotals(tr)
            {
                let total = 0;
                
                tr.find('.gift-total').each(function(){
                    total += parseInt($(this).val());
                });
                
                tr.find('.gift-total').each(function(){
                    let p = $(this);

                    p.parent().next().text((parseInt(p.val()) / total * 100).toFixed(2) + '%');
                });
            }

            setRatesByTotals($('tbody tr:last-child'));
        });
    </script>
</body>

</html>
