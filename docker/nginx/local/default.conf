server {
    listen 80;
    server_name localhost _;

    root /var/www;
    index index.php index.html;

    access_log /var/log/nginx/project_access.log;
    error_log /var/log/nginx/project_error.log;

    client_max_body_size 25M;

    # Keep localhost Docker port during directory redirects.
    # /product -> /product/
    absolute_redirect off;

    # Redirect /apw to /apw/
    location = /apw {
        return 301 /apw/;
    }

    # APW routes:
    # /apw/user/abc -> /apw/index.php
    location /apw/ {
        try_files $uri $uri/ /apw/index.php?$query_string;
    }

    # Allow PHP files only inside the WordPress folder.
    location ~ ^/apw/.+\.php$ {
        try_files $uri =404;

        fastcgi_pass app:9000;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;

        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param SERVER_PORT $server_port;
        fastcgi_param REQUEST_SCHEME $scheme;

        fastcgi_param HTTP_AUTHORIZATION $http_authorization;

        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_host;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;

        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_connect_timeout 60;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
    }

    # API routes:
    # /api/user/abc -> /api/index.php
    location = /api {
        return 301 /api/;
    }

    location /api/ {
        try_files $uri $uri/ /api/index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Allow only index.php entry points:
    # /index.php
    # /product/index.php
    # /movie/index.php
    # /en/index.php
    location ~ ^/(?:.+/)?index\.php$ {
        try_files $uri =404;

        fastcgi_pass app:9000;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;

        # Preserve localhost:8076.
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param SERVER_PORT $server_port;
        fastcgi_param REQUEST_SCHEME $scheme;

        fastcgi_param HTTP_AUTHORIZATION $http_authorization;

        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_host;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;

        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_connect_timeout 60;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
    }

    # Block PHP scripts other than index.php.
    location ~ \.php$ {
        return 404;
    }

    # Block hidden files such as .env and .git.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Static assets.
    location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|svg|ico|woff|woff2|ttf|eot)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
}
